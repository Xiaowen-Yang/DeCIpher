[workspace]
members = [
    "crates/cli",
    "crates/tui",
    "crates/protocol",
    "crates/markdown",
    "crates/clipboard",
    "crates/agent-bridge",
    "crates/mock-provider",
    "crates/providers",
    "crates/policy",
    "crates/tools",
    "crates/runtime",
    "crates/session-store",
]
resolver = "2"

[workspace.package]
version = "0.1.5"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Internal crates
decipher-protocol = { path = "crates/protocol" }
decipher-tui = { path = "crates/tui" }
decipher-markdown = { path = "crates/markdown" }
decipher-clipboard = { path = "crates/clipboard" }
decipher-agent-bridge = { path = "crates/agent-bridge" }
decipher-providers = { path = "crates/providers" }
decipher-mock-provider = { path = "crates/mock-provider" }
decipher-policy = { path = "crates/policy" }
decipher-tools = { path = "crates/tools" }
decipher-runtime = { path = "crates/runtime" }
decipher-session-store = { path = "crates/session-store" }

# External
crossterm = { version = "0.28", features = ["bracketed-paste", "event-stream"] }
pulldown-cmark = { version = "0.12", default-features = false, features = ["simd"] }
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-onig"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"
libc = "0.2"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
textwrap = "0.16"
unicode-width = "0.2"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
thiserror = "2"
async-trait = "0.1"
tokio-util = { version = "0.7", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
