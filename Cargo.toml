[workspace]
members = [
    "crates/cli",
    "crates/tui",
    "crates/protocol",
    "crates/markdown",
    "crates/clipboard",
    "crates/agent-bridge",
]
resolver = "2"

[workspace.package]
version = "0.1.5"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Internal crates
decipher-protocol = { path = "crates/protocol" }
decipher-tui = { path = "crates/tui" }
decipher-markdown = { path = "crates/markdown" }
decipher-clipboard = { path = "crates/clipboard" }
decipher-agent-bridge = { path = "crates/agent-bridge" }

# External
crossterm = { version = "0.28", features = ["bracketed-paste", "event-stream"] }
pulldown-cmark = { version = "0.12", default-features = false, features = ["simd"] }
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-onig"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"

[profile.release]
opt-level = "z"
lto = true
strip = true
