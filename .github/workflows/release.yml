name: Release & Publish

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  # Build Rust TUI binaries for each platform
  build-tui:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: decipher-tui-darwin-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: decipher-tui-darwin-x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: decipher-tui-linux-x64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: decipher-tui-linux-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: decipher-tui-win32-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build TUI
        working-directory: tui
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Rename binary
        shell: bash
        run: |
          SRC="tui/target/${{ matrix.target }}/release/decipher-tui"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            SRC="${SRC}.exe"
          fi
          cp "$SRC" "${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  # Publish npm package and create GitHub release with TUI binaries
  release:
    needs: build-tui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Validate version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Error: tag v$TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "VERSION=$PKG_VERSION" >> "$GITHUB_ENV"

      - run: pnpm test

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Download all TUI binaries
      - uses: actions/download-artifact@v4
        with:
          path: tui-binaries

      - name: List binaries
        run: find tui-binaries -type f | sort

      # Create GitHub Release with TUI binaries attached
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DeCIpher ${{ env.VERSION }}
          generate_release_notes: true
          files: |
            tui-binaries/decipher-tui-darwin-arm64/decipher-tui-darwin-arm64
            tui-binaries/decipher-tui-darwin-x64/decipher-tui-darwin-x64
            tui-binaries/decipher-tui-linux-x64/decipher-tui-linux-x64
            tui-binaries/decipher-tui-linux-arm64/decipher-tui-linux-arm64
            tui-binaries/decipher-tui-win32-x64.exe/decipher-tui-win32-x64.exe
