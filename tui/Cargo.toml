[package]
name = "decipher-tui"
version = "0.1.5"
edition = "2021"
description = "Terminal UI frontend for DeCIpher"
license = "MIT"

[[bin]]
name = "decipher-tui"
path = "src/main.rs"

[dependencies]
crossterm = { version = "0.28", features = ["bracketed-paste", "event-stream"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"

[profile.release]
opt-level = "z"
lto = true
strip = true
