[package]
name = "decipher-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI entry point for DeCIpher"

[[bin]]
name = "decipher-tui"
path = "src/main.rs"

[dependencies]
decipher-protocol      = { workspace = true }
decipher-tui           = { workspace = true }
decipher-runtime       = { path = "../runtime" }
decipher-providers     = { path = "../providers" }
decipher-policy        = { path = "../policy" }
decipher-clipboard     = { workspace = true }
decipher-session-store = { workspace = true }
decipher-mcp           = { workspace = true }
crossterm   = { workspace = true }
tokio       = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
futures     = { workspace = true }
ratatui     = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
